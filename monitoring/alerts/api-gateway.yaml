# HTBase API Gateway Alert Rules
# These rules monitor the API Gateway for errors, latency, and availability issues.
# Use with Prometheus Alertmanager.

groups:
  - name: htbase_api_gateway
    rules:
      # High Error Rate Alert
      - alert: HTBaseHighErrorRate
        expr: |
          sum(rate(htbase_http_requests_total{status_code=~"5.."}[5m]))
          / sum(rate(htbase_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          service: api-gateway
        annotations:
          summary: "HTBase API error rate > 5%"
          description: "The API Gateway is experiencing elevated error rates ({{ $value | humanizePercentage }} of requests returning 5xx)."
          runbook_url: "https://github.com/yourorg/htbase/blob/main/docs/runbooks/api-errors.md"

      # High Latency Alert (P95)
      - alert: HTBaseHighLatencyP95
        expr: |
          histogram_quantile(0.95, rate(htbase_http_request_duration_seconds_bucket[5m])) > 2.0
        for: 5m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: "HTBase API P95 latency > 2s"
          description: "The 95th percentile latency for API requests is {{ $value | humanizeDuration }}."
          runbook_url: "https://github.com/yourorg/htbase/blob/main/docs/runbooks/api-errors.md"

      # Very High Latency Alert (P99)
      - alert: HTBaseVeryHighLatencyP99
        expr: |
          histogram_quantile(0.99, rate(htbase_http_request_duration_seconds_bucket[5m])) > 5.0
        for: 5m
        labels:
          severity: critical
          service: api-gateway
        annotations:
          summary: "HTBase API P99 latency > 5s"
          description: "The 99th percentile latency for API requests is {{ $value | humanizeDuration }}."
          runbook_url: "https://github.com/yourorg/htbase/blob/main/docs/runbooks/api-errors.md"

      # No Traffic Alert (possible outage)
      - alert: HTBaseNoTraffic
        expr: |
          sum(rate(htbase_http_requests_total[5m])) == 0
        for: 10m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: "HTBase API receiving no traffic"
          description: "The API Gateway has received no requests in the last 10 minutes. This may indicate an outage or routing issue."
          runbook_url: "https://github.com/yourorg/htbase/blob/main/docs/runbooks/api-errors.md"

      # High 4xx Rate (client errors)
      - alert: HTBaseHighClientErrorRate
        expr: |
          sum(rate(htbase_http_requests_total{status_code=~"4.."}[5m]))
          / sum(rate(htbase_http_requests_total[5m])) > 0.20
        for: 10m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: "HTBase API client error rate > 20%"
          description: "Elevated client error rate ({{ $value | humanizePercentage }}). Check for API misuse or invalid requests."
          runbook_url: "https://github.com/yourorg/htbase/blob/main/docs/runbooks/api-errors.md"
